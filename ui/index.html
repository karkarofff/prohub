<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">

    <!-- Barre latérale -->
    <aside class="sidebar">
      <div class="brand" id="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="3" y="3" width="7.5" height="7.5" rx="2"/>
            <rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
            <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/>
            <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">ProHub</div>
          <div class="brand-sub">Tout à portée de clic</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-nav="home">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span>Accueil</span>
        </button>
        <button class="nav-item" data-tab="sites">
          <svg class="nav-ico c-sites" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
          <span>Sites</span><span class="nav-count" id="count-sites"></span>
        </button>
        <button class="nav-item" data-tab="scripts">
          <svg class="nav-ico c-scripts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l4 4-4 4M11 17h8"/></svg>
          <span>Scripts</span><span class="nav-count" id="count-scripts"></span>
        </button>
        <button class="nav-item" data-tab="apps">
          <svg class="nav-ico c-apps" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          <span>Applications</span><span class="nav-count" id="count-apps"></span>
        </button>
        <button class="nav-item" data-tab="shortcuts">
          <svg class="nav-ico c-shortcuts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg>
          <span>Raccourcis</span><span class="nav-count" id="count-shortcuts"></span>
        </button>
        <button class="nav-item" data-tab="monitors">
          <svg class="nav-ico c-monitors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 4.5 14 2.5-7H21"/></svg>
          <span>Moniteurs</span><span class="nav-count" id="count-monitors"></span>
        </button>
        <button class="nav-item" data-tab="routines">
          <svg class="nav-ico c-routines" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          <span>Routines</span><span class="nav-count" id="count-routines"></span>
        </button>
      </nav>

      <div class="nav-section">
        <div class="nav-section-head">
          <span>Collections</span>
          <button class="btn-icon btn-mini" id="btn-add-collection" title="Nouvelle collection">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <nav class="nav" id="nav-collections"></nav>
      </div>

      <div class="sidebar-footer">
        <div class="hotkey-card">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg>
          <div>
            <div class="hk-label">Raccourci global</div>
            <div class="hk-combo">Ctrl + Espace</div>
          </div>
        </div>
        <button class="nav-item" id="btn-settings">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.02z"/>
          </svg>
          <span>Paramètres</span>
        </button>
      </div>
    </aside>

    <!-- Colonne principale -->
    <div class="main-col">
      <header class="topbar">
        <button class="searchbox" id="search-trigger">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Rechercher un site, une application, un script…</span>
          <kbd>Ctrl + K</kbd>
        </button>
        <div class="topbar-actions">
          <button class="btn-icon" id="btn-theme" title="Thème clair / sombre">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="btn-icon" id="btn-bell" title="Alertes">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-badge" id="bell-badge" hidden></span>
          </button>
        </div>
      </header>

      <main class="content" id="content">
        <!-- Rempli par app.js : accueil ou vue catégorie -->
      </main>
    </div>
  </div>

  <!-- Modale d'édition -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="btn-icon" id="modal-close" title="Fermer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer">
        <button class="btn" id="modal-cancel">Annuler</button>
        <button class="btn btn-accent" id="modal-save">Enregistrer</button>
      </footer>
    </div>
  </div>

  <!-- Paramètres -->
  <div class="modal-backdrop" id="settings" hidden>
    <div class="modal settings" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2>Paramètres</h2>
        <button class="btn-icon" id="settings-close" title="Fermer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="settings-main">
        <nav class="settings-nav" id="settings-nav"></nav>
        <div class="settings-content" id="settings-content"></div>
      </div>
      <footer class="modal-footer">
        <button class="btn" id="settings-cancel">Annuler</button>
        <button class="btn btn-accent" id="settings-save">Enregistrer</button>
      </footer>
    </div>
  </div>

  <!-- Confirmation -->
  <div class="modal-backdrop" id="confirm" hidden>
    <div class="modal modal-sm" role="alertdialog" aria-modal="true">
      <div class="confirm-msg" id="confirm-msg"></div>
      <footer class="modal-footer">
        <button class="btn" id="confirm-no">Annuler</button>
        <button class="btn btn-accent" id="confirm-yes">Confirmer</button>
      </footer>
    </div>
  </div>

  <!-- Palette de commandes -->
  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette">
      <input id="palette-input" placeholder="Rechercher un site, un script, une routine…" autocomplete="off" spellcheck="false">
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <!-- Menu contextuel -->
  <div class="ctx" id="ctx" hidden></div>

  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
